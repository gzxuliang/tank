# 推送 main 分支后自动部署 Cloudflare Worker（静态页面 + Durable Object 中继）
# 需要在仓库 Settings → Secrets 配置：CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID
name: 部署 Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/**'
      - 'worker/**'
      - 'wrangler.toml'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # 生成 Workers Static Assets 目录（index.html + src/）
      - run: node worker/build-public.mjs
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
