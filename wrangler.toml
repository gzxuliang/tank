# Cloudflare Worker 版部署配置（方案 3：全 serverless）
# 部署：npm run deploy:worker（或推送 main 分支由 GitHub Actions 自动部署）
name = "tank-battle"
main = "worker/index.js"
compatibility_date = "2025-06-01"

# 静态游戏页面（public/ 由 worker/build-public.mjs 生成）
# run_worker_first：请求先过 Worker 路由（WebSocket 走 Durable Object，其余走静态资源）
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# 房间中继 Durable Object
[[durable_objects.bindings]]
name = "LOBBY"
class_name = "RoomLobby"

# 免费档只支持 SQLite 后端的 Durable Object
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomLobby"]
