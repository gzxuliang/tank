# Cloudflare Worker 版部署配置（方案 3：全 serverless）
# 部署：npm run deploy:worker（或推送 main 分支由 GitHub Actions 自动部署）
name = "tank"
main = "worker/index.js"
compatibility_date = "2025-06-01"

# 静态游戏页面（public/ 由 worker/build-public.mjs 生成）
# 默认资源优先路由：页面请求直接命中静态资源（不过 Worker，省请求数）；
# WebSocket 走 /ws 路径，无对应文件才进入 Worker → Durable Object
[assets]
directory = "./public"
binding = "ASSETS"

# 房间中继 Durable Object
[[durable_objects.bindings]]
name = "LOBBY"
class_name = "RoomLobby"

# 免费档只支持 SQLite 后端的 Durable Object
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomLobby"]
